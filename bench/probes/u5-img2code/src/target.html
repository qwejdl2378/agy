<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:-apple-system,"PingFang SC",sans-serif;color:#1d2129;width:1200px;height:760px}
.side{position:fixed;left:0;top:0;bottom:0;width:220px;background:#1f2633;color:#c9cdd4;padding:20px 12px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:16px;margin:0 8px 28px}
.logo i{width:28px;height:28px;border-radius:8px;background:#4f7cff;display:inline-block}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;font-size:14px;margin-bottom:2px}
.nav a.on{background:#2d3646;color:#fff}.nav a b{width:16px;height:16px;border-radius:4px;background:#59647a;display:inline-block}.nav a.on b{background:#4f7cff}
.main{margin-left:220px;padding:24px 32px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:22px;margin:0}.top .btn{background:#4f7cff;color:#fff;border-radius:6px;padding:8px 16px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.k{background:#fff;border-radius:10px;padding:16px 18px;border:1px solid #e5e6eb}
.k .l{font-size:13px;color:#86909c}.k .v{font-size:26px;font-weight:600;margin:6px 0 4px}.k .d{font-size:12px;color:#00b42a}.k .d.n{color:#f53f3f}
.row{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.card{background:#fff;border-radius:10px;border:1px solid #e5e6eb;padding:16px 18px}
.card h2{font-size:15px;margin:0 0 14px}
.bars{display:flex;align-items:flex-end;gap:14px;height:220px;padding-top:10px;border-bottom:1px solid #e5e6eb}
.bars div{flex:1;background:#4f7cff;border-radius:4px 4px 0 0}.bars div.alt{background:#a9bdff}
.xl{display:flex;gap:14px;font-size:11px;color:#86909c;margin-top:6px}.xl span{flex:1;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:10px 0;border-bottom:1px solid #f2f3f5}td.r{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#e8f3ff;color:#165dff}.tag.w{background:#fff7e8;color:#d25f00}
</style></head><body>
<div class="side"><div class="logo"><i></i>Orbit 运营台</div><div class="nav">

<div class="main"><div class="top"><h1>总览</h1><span class="btn">导出报表</span></div>
<div class="kpis"><div class="k"><div class="l">今日销售额</div><div class="v">¥128,430</div><div class="d">▲ 12.4% 较昨日</div></div>
<div class="k"><div class="l">订单数</div><div class="v">1,842</div><div class="d">▲ 5.1% 较昨日</div></div>
<div class="k"><div class="l">客单价</div><div class="v">¥69.7</div><div class="d n">▼ 2.3% 较昨日</div></div>
<div class="k"><div class="l">退款率</div><div class="v">1.8%</div><div class="d">▼ 0.4pp 较昨日</div></div></div>
<div class="row"><div class="card"><h2>近 12 周销售额</h2><div class="bars">
<div style="height:42%"></div><div style="height:55%"></div><div style="height:48%"></div><div style="height:63%"></div><div style="height:58%"></div><div style="height:71%"></div><div style="height:66%"></div><div style="height:80%"></div><div style="height:74%"></div><div style="height:86%"></div><div style="height:79%" class="alt"></div><div style="height:93%" class="alt"></div></div>
<div class="xl"><span>W1</span><span>W2</span><span>W3</span><span>W4</span><span>W5</span><span>W6</span><span>W7</span><span>W8</span><span>W9</span><span>W10</span><span>W11</span><span>W12</span></div></div>
<div class="card"><h2>待处理事项</h2><table>
<tr><td>待发货订单</td><td class="r">126</td><td class="r"><span class="tag">去处理</span></td></tr>
<tr><td>售后申请</td><td class="r">18</td><td class="r"><span class="tag w">紧急</span></td></tr>
<tr><td>库存预警商品</td><td class="r">9</td><td class="r"><span class="tag w">紧急</span></td></tr>
<tr><td>待审核评价</td><td class="r">43</td><td class="r"><span class="tag">去处理</span></td></tr>
<tr><td>优惠券即将到期</td><td class="r">5</td><td class="r"><span class="tag">查看</span></td></tr></table></div></div></div>
</body></html>
